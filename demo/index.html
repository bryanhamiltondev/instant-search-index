<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>instant-search-index - demo</title>
<link rel="stylesheet" href="../src/search.css">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    padding: 48px 24px;
    background: #0d1117;
    color: #e6edf3;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  h1 span { color: #e3b341; }
  p.lead { color: #8b949e; margin: 0 0 40px; }
  section { margin: 0 0 48px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em; color: #8b949e; margin: 0 0 16px; }
  input {
    width: 100%;
    box-sizing: border-box;
    background: #161b22;
    color: #e6edf3;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 12px 16px;
    font: inherit;
  }
  input:focus { outline: none; border-color: #e3b341; }
  kbd {
    font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #161b22;
    border: 1px solid #30363d;
    border-bottom-width: 3px;
    border-radius: 4px;
    padding: 2px 6px;
  }
</style>
</head>
<body>
<main>
  <h1>instant<span>-</span>search-index</h1>
  <p class="lead">Instant search from a prebuilt JSON index. No server round-trips, no framework, no library. Try typing - then put the mouse away and use <kbd>&darr;</kbd> <kbd>&uarr;</kbd> <kbd>Enter</kbd> <kbd>Esc</kbd>.</p>

  <section>
    <h2>Artists (badges + subtitles)</h2>
    <input id="artistSearch" type="text" placeholder="Try 'car', 'techno', 'amelie'...">
  </section>

  <section>
    <h2>Venues (plain records)</h2>
    <input id="venueSearch" type="text" placeholder="Try 'marquee', 'ibiza'...">
  </section>
</main>

<script>
  /* Demo data in the exact shape the engine consumes - the same contract
     the production server emits on The DJ Calendar. */
  var ARTISTS = [
    { title: "Carl Cox",         subtitle: "Techno / House",      keywords: "techno house icon ibiza space",      badge: "Artist", url: "#" },
    { title: "Amelie Lens",      subtitle: "Techno",              keywords: "techno belgium lens",                badge: "Artist", url: "#" },
    { title: "Charlotte de Witte",subtitle: "Techno",              keywords: "techno belgium kntxt",               badge: "Artist", url: "#" },
    { title: "Alan Walker",      subtitle: "EDM",                 keywords: "edm progressive house walker",       badge: "Artist", url: "#" },
    { title: "Black Coffee",     subtitle: "Afro House",          keywords: "afro house deep south africa",       badge: "Artist", url: "#" },
    { title: "Afrojack",         subtitle: "EDM",                 keywords: "edm dutch electro",                  badge: "Artist", url: "#" },
    { title: "Martin Garrix",    subtitle: "EDM / Progressive",   keywords: "edm progressive stmpd",              badge: "Artist", url: "#" },
    { title: "David Guetta",     subtitle: "EDM / Pop",           keywords: "edm pop french house",               badge: "Artist", url: "#" },
    { title: "Nina Kraviz",      subtitle: "Techno",              keywords: "techno russia trip",                 badge: "Artist", url: "#" },
    { title: "Fisher",           subtitle: "Tech House",          keywords: "tech house australia los tijuanas",  badge: "Artist", url: "#" }
  ];
  var VENUES = [
    { title: "Marquee New York",  subtitle: "New York City, NY",              keywords: "nyc manhattan nightclub", url: "#" },
    { title: "Pacha New York",    subtitle: "New York City, NY",              keywords: "nyc nightclub ibiza brand", url: "#" },
    { title: "The Brooklyn Mirage",subtitle: "Brooklyn, NY",                  keywords: "outdoor brooklyn avante", url: "#" },
    { title: "HQ2 Beachclub",     subtitle: "Atlantic City, NJ",             keywords: "ocean casino resort ac beachclub", url: "#" },
    { title: "Ushuaia Ibiza",     subtitle: "Ibiza, ES",                     keywords: "open air ibiza spain", url: "#" },
    { title: "Tomorrowland",      subtitle: "Boom, BE",                      keywords: "festival belgium mainstage", url: "#" },
    { title: "E DC Las Vegas",    subtitle: "Las Vegas, NV",                 keywords: "festival edc motorspeedway", url: "#" }
  ];

  document.getElementById("artistSearch").setAttribute("data-instant-search", JSON.stringify(ARTISTS));
  document.getElementById("venueSearch").setAttribute("data-instant-search", JSON.stringify(VENUES));
</script>
<script src="../src/search.js"></script>
</body>
</html>
